[package]
name = "v4l2_decoder_nif"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "v4l2_decoder_nif"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
rustler = "0.38"
v4l2_decoder = { path = "../v4l2_decoder" }
video-interop = "0.1.2"

[profile.release]
opt-level = 3
strip = "symbols"
